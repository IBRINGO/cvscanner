[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvscanner-backend"
version = "0.1.0"
description = "CVScanner backend — Django + DRF API, Celery workers, and the future ATS Intelligence Engine."
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16,<3.19",
    "psycopg[binary]>=3.2,<4.0",
    "celery>=5.4,<6.0",
    "redis>=5.0,<6.0",
    "django-cors-headers>=4.4,<5.0",
    "django-environ>=0.11,<0.15",
    "dj-database-url>=2.2,<4.0",
    "pdfplumber>=0.11,<0.12",
    "python-docx>=1.1,<1.3",
    "requests>=2.32,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.8",
    "reportlab>=4.2,<5.1",
]

[tool.setuptools]
# This project is a Django application, not a distributable library — the
# top-level directories (apps, config, domain, ...) are not meant to be
# packaged for PyPI. Disabling package discovery keeps `pip install -e .`
# usable purely to install the dependencies declared above.
packages = []

[tool.black]
line-length = 110
target-version = ["py312"]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
