[pytest]
DJANGO_SETTINGS_MODULE = config.settings.testing
python_files = tests.py test_*.py *_tests.py
testpaths = tests
; pytest's built-in default norecursedirs includes "CVS" (a legacy VCS
; metadata directory name). On a case-insensitive filesystem that also
; matches our tests/api/cvs/ resource directory and silently drops it
; from collection - overriding the default without "CVS" fixes that.
norecursedirs = *.egg .* _darcs build dist node_modules venv {arch}
