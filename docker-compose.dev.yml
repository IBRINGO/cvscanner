# Local-development overrides: bind-mounts for live reload. Merge with
# docker-compose.yml (the Makefile does this for you):
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
services:
  backend:
    volumes:
      - ./backend:/app
    environment:
      DJANGO_DEBUG: "true"

  worker:
    volumes:
      - ./backend:/app

  frontend:
    volumes:
      - ./frontend:/app
      - /app/node_modules
